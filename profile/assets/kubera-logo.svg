<?xml version="1.0" encoding="UTF-8"?>
<!-- kubera — primary mark (Option A: gradient monogram). Scales cleanly to favicon size. -->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="kubera">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="34" fill="#0b0e14"/>
  <rect x="8.5" y="8.5" width="143" height="143" rx="33.5" fill="none" stroke="url(#kg)" stroke-width="3" opacity="0.9"/>
  <!-- monogram "k": stem + two diagonals, with a rising-bar accent on the upper arm -->
  <g stroke="url(#kg)" stroke-width="13" stroke-linecap="round" fill="none">
    <line x1="56" y1="38" x2="56" y2="122"/>
    <line x1="56" y1="82" x2="104" y2="44"/>
    <line x1="56" y1="82" x2="104" y2="120"/>
  </g>
  <!-- subtle up-trend ticks (perp/markets motif) -->
  <g fill="url(#kg)" opacity="0.95">
    <rect x="100" y="40" width="9" height="9" rx="2"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- kubera — horizontal wordmark (mark + type), for README/site headers. -->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120" role="img" aria-label="kubera">
  <defs>
    <linearGradient id="kw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <rect x="8" y="20" width="80" height="80" rx="20" fill="#0b0e14"/>
  <rect x="8.5" y="20.5" width="79" height="79" rx="19.5" fill="none" stroke="url(#kw)" stroke-width="2.5" opacity="0.9"/>
  <g stroke="url(#kw)" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="34" y1="38" x2="34" y2="82"/>
    <line x1="34" y1="60" x2="60" y2="40"/>
    <line x1="34" y1="60" x2="60" y2="80"/>
  </g>
  <!-- wordmark -->
  <text x="108" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="1" fill="#e6edf3">kubera</text>
</svg>
